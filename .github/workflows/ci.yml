name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: macos-14
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      # Live-model tests skip themselves when Ollama is absent, as it is in CI.
      - run: uv run pytest -q

  frontend:
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - name: API types match the backend
        run: |
          (cd ../backend && uv sync --frozen)
          pnpm gen:api
          git diff --exit-code -- openapi.json src/api/schema.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  shell:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: pnpm build
        working-directory: desktop
      - run: cargo check --locked
        working-directory: desktop/src-tauri
